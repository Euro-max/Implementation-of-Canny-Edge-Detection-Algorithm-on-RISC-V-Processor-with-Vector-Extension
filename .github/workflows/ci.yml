name: RISC-V Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Compile and Run QEMU Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QEMU and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static python3-numpy python3-pil

      - name: Download Full RISC-V C++ Toolchain (xPack GCC 13)
        run: |
          wget https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          tar -xzf xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          echo "$(pwd)/xpack-riscv-none-elf-gcc-13.2.0-2/bin" >> $GITHUB_PATH

      - name: Build Scalar and RVV Binaries
        run: |
          make build_rv/canny_rv RV_CXX=riscv-none-elf-g++
          make rvv RV_CXX=riscv-none-elf-g++

      - name: Run Legacy QEMU Tests
        run: |
          make test_legacy RV_CXX=riscv-none-elf-g++

  deploy-docs:
    name: Generate and Deploy Doxygen
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: |
          make docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          force_orphan: true
